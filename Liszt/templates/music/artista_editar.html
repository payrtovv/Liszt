{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar perfil - Liszt</title>
  <link rel="stylesheet" href="{% static 'css/music.css' %}">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="/home">♪ Liszt</a>
    <a href="/music/artistas/">Artistas</a>
    <a href="/music/canciones/">Canciones</a>
    <a href="/music/generos/">Géneros</a>
    <a href="/music/discograficas/">Discográficas</a>
  </nav>

  <div class="container">
    <a class="back-link" href="/music/artistas/{{ artista.idArtista }}/">← Volver al perfil</a>

    <div class="card" style="max-width:600px">
      <h1>Editar perfil</h1>
      <p style="color:#aaa; margin-bottom:1.5rem">{{ artista.nombre }} {{ artista.apellido }}</p>

      <form method="post">
        {% csrf_token %}

        <div class="form-group">
          <label for="biografia">Biografía</label>
          <textarea id="biografia" name="biografia" rows="5">{{ artista.biografia }}</textarea>
        </div>

        <div class="form-group">
          <label for="discografica">Discográfica</label>
          <select id="discografica" name="discografica">
            {% for d in discograficas %}
              <option value="{{ d.id }}" {% if d.nombre == artista.discografica %}selected{% endif %}>
                {{ d.nombre }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Guardar cambios</button>
          <a class="btn btn-secondary" href="/music/artistas/{{ artista.idArtista }}/">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
